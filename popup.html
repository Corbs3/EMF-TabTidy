<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TabTidy</title>
  <style>
    :root {
      --bg:          #FFFFFF;
      --surface:     #F8F8F8;
      --border:      #F0F0F0;
      --text:        #1A1A1A;
      --text2:       #555555;
      --text3:       #AAAAAA;
      --teal:        #00B6A8;
      --teal-light:  #E6F7F6;
      --teal-text:   #005C56;
      --red:         #E05555;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 300px;
      max-height: 580px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      display: flex; flex-direction: column; overflow: hidden;
    }

    /* ── Header ── */
    header {
      display: flex; align-items: center; gap: 10px;
      padding: 14px 16px 12px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .logo {
      width: 34px; height: 34px; border-radius: 8px;
      background: var(--teal-light);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .brand-name { font-size: 14px; font-weight: 700; color: var(--text); }
    .brand-sub  { font-size: 11px; color: var(--text3); margin-top: 1px; }
    .header-settings {
      margin-left: auto; font-size: 11px; font-weight: 600;
      color: var(--text3); background: none; border: none;
      cursor: pointer; padding: 4px;
    }
    .header-settings:hover { color: var(--teal); }

    /* ── Buttons ── */
    .btn-wrap {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      display: flex; gap: 8px; flex-shrink: 0;
    }
    .btn-group {
      flex: 1; padding: 10px;
      background: var(--teal); color: #fff;
      border: none; border-radius: 8px;
      font-size: 13px; font-weight: 700;
      cursor: pointer; transition: background 0.15s;
    }
    .btn-group:hover { background: #009990; }

    .btn-sm-action {
      padding: 10px 12px;
      background: transparent; color: var(--text3);
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-size: 12px; font-weight: 600;
      cursor: pointer; transition: all 0.15s;
      white-space: nowrap;
    }
    .btn-sm-action:hover { border-color: var(--teal); color: var(--teal); }
    .btn-sm-action.danger:hover { border-color: var(--red); color: var(--red); }

    /* ── Toolbar (sort + save session) ── */
    .toolbar {
      display: none; padding: 7px 16px;
      border-bottom: 1px solid var(--border);
      align-items: center; justify-content: space-between;
      flex-shrink: 0;
    }
    .toolbar.visible { display: flex; }

    .sort-pills { display: flex; gap: 5px; }
    .sort-pill {
      padding: 3px 9px; border-radius: 10px;
      font-size: 11px; font-weight: 600;
      border: 1.5px solid var(--border);
      color: var(--text3); background: transparent;
      cursor: pointer; transition: all 0.12s;
    }
    .sort-pill:hover  { border-color: var(--teal); color: var(--teal); }
    .sort-pill.active { background: var(--teal-light); border-color: var(--teal); color: var(--teal-text); }

    .btn-save-session {
      font-size: 11px; font-weight: 600; color: var(--teal);
      background: none; border: none; cursor: pointer; padding: 3px 0;
    }
    .btn-save-session:hover { text-decoration: underline; }

    /* ── Summary ── */
    .summary {
      padding: 7px 16px;
      border-bottom: 1px solid var(--border);
      font-size: 11px; color: var(--text3);
      flex-shrink: 0;
    }
    .summary strong { color: var(--teal); font-weight: 700; }

    /* ── Groups list ── */
    .groups { overflow-y: auto; flex: 1; }

    .group-block { border-bottom: 1px solid var(--border); }
    .group-block:last-child { border-bottom: none; }

    .group-header {
      display: flex; align-items: center; gap: 8px;
      padding: 9px 16px; cursor: pointer;
      transition: background 0.1s;
    }
    .group-header:hover { background: var(--surface); }

    .group-swatch { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }

    .group-name {
      font-size: 13px; font-weight: 600; color: var(--text);
      flex: 1; min-width: 0;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .group-name-input {
      font-size: 13px; font-weight: 600; color: var(--text);
      flex: 1; min-width: 0; border: none; outline: none;
      background: transparent; font-family: inherit;
      border-bottom: 1.5px solid var(--teal);
    }

    .group-count   { font-size: 11px; color: var(--text3); flex-shrink: 0; }
    .group-chevron { font-size: 10px; color: var(--text3); flex-shrink: 0; transition: transform 0.15s; }
    .group-block.open .group-chevron { transform: rotate(90deg); }

    .btn-ungroup-single {
      font-size: 10px; color: var(--text3);
      background: none; border: none; cursor: pointer;
      padding: 2px 4px; flex-shrink: 0;
      opacity: 0; transition: opacity 0.1s;
    }
    .group-header:hover .btn-ungroup-single { opacity: 1; }
    .btn-ungroup-single:hover { color: var(--red); }

    .tab-list { display: none; }
    .group-block.open .tab-list { display: block; }

    .tab-row {
      display: flex; align-items: center; gap: 8px;
      padding: 5px 16px 5px 34px;
      border-top: 1px solid var(--border);
      cursor: pointer; transition: background 0.1s;
    }
    .tab-row:hover { background: var(--surface); }

    .tab-favicon { width: 14px; height: 14px; border-radius: 3px; flex-shrink: 0; object-fit: contain; }
    .tab-favicon-placeholder { width: 14px; height: 14px; border-radius: 3px; background: var(--border); flex-shrink: 0; }
    .tab-title { font-size: 11px; color: var(--text2); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* ── Sessions ── */
    .sessions-section {
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }
    .sessions-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 16px; cursor: pointer;
      font-size: 10px; font-weight: 700; color: var(--text3);
      text-transform: uppercase; letter-spacing: 0.08em;
    }
    .sessions-header:hover { background: var(--surface); }
    .sessions-list { display: none; }
    .sessions-list.open { display: block; }

    .session-row {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 16px;
      border-top: 1px solid var(--border);
    }
    .session-name { font-size: 12px; font-weight: 600; color: var(--text); flex: 1; }
    .session-meta { font-size: 11px; color: var(--text3); }
    .btn-restore {
      font-size: 11px; font-weight: 600; color: var(--teal);
      background: none; border: none; cursor: pointer; padding: 3px 0;
      flex-shrink: 0;
    }
    .btn-restore:hover { text-decoration: underline; }
    .btn-delete-session {
      font-size: 13px; color: var(--text3);
      background: none; border: none; cursor: pointer; padding: 2px 4px;
      flex-shrink: 0;
    }
    .btn-delete-session:hover { color: var(--red); }

    /* ── Empty ── */
    .empty { padding: 28px 20px; text-align: center; color: var(--text3); font-size: 13px; line-height: 1.7; display: none; }
    .empty.visible { display: block; }
    .empty-icon { width: 40px; height: 40px; border: 2px solid var(--border); border-radius: 50%; margin: 0 auto 14px; display: flex; align-items: center; justify-content: center; }

    /* ── Status ── */
    .status { font-size: 11px; color: var(--teal); text-align: center; padding: 5px 16px; display: none; flex-shrink: 0; }
    .status.visible { display: block; }

    /* ── Settings overlay ── */
    #view-settings {
      position: absolute; inset: 0;
      background: var(--bg);
      display: none; flex-direction: column;
      z-index: 10;
    }
    .settings-header {
      display: flex; align-items: center; gap: 10px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .btn-back { background: none; border: none; cursor: pointer; font-size: 13px; font-weight: 600; color: var(--teal); }
    .settings-title { font-size: 14px; font-weight: 700; }
    .settings-body { flex: 1; overflow-y: auto; padding: 16px; }
    .setting-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 0; border-bottom: 1px solid var(--border);
    }
    .setting-label { font-size: 13px; color: var(--text2); }
    .setting-hint  { font-size: 11px; color: var(--text3); margin-top: 2px; }
    .toggle {
      width: 36px; height: 20px; border-radius: 10px;
      background: var(--border); position: relative;
      cursor: pointer; border: none; transition: background 0.2s; flex-shrink: 0;
    }
    .toggle.on { background: var(--teal); }
    .toggle::after {
      content: ''; position: absolute;
      width: 14px; height: 14px; border-radius: 50%;
      background: white; top: 3px; left: 3px;
      transition: transform 0.2s;
    }
    .toggle.on::after { transform: translateX(16px); }

    /* ── Save session modal ── */
    #modal-save-session {
      position: absolute; inset: 0;
      background: rgba(0,0,0,0.3);
      display: none; align-items: center; justify-content: center;
      z-index: 20;
    }
    .modal-box {
      background: var(--bg); border-radius: 12px;
      padding: 20px; width: 240px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.15);
    }
    .modal-title  { font-size: 14px; font-weight: 700; margin-bottom: 12px; }
    .modal-input  {
      width: 100%; padding: 9px 12px;
      border: 1.5px solid var(--border); border-radius: 8px;
      font-size: 13px; color: var(--text);
      background: var(--surface); outline: none;
      font-family: inherit; margin-bottom: 12px;
    }
    .modal-input:focus { border-color: var(--teal); }
    .modal-actions { display: flex; gap: 8px; }
    .btn-modal-save {
      flex: 1; padding: 9px;
      background: var(--teal); color: #fff;
      border: none; border-radius: 8px;
      font-size: 13px; font-weight: 700; cursor: pointer;
    }
    .btn-modal-cancel {
      padding: 9px 14px;
      background: transparent; color: var(--text3);
      border: 1.5px solid var(--border);
      border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">
      <svg width="22" height="22" viewBox="0 0 52 52" fill="none">
        <rect x="8"  y="8"  width="16" height="16" rx="4" fill="#00B6A8"/>
        <rect x="28" y="8"  width="16" height="16" rx="4" fill="#00B6A8" opacity="0.7"/>
        <rect x="8"  y="28" width="16" height="16" rx="4" fill="#00B6A8" opacity="0.7"/>
        <rect x="28" y="28" width="16" height="16" rx="4" fill="#00B6A8" opacity="0.4"/>
      </svg>
    </div>
    <div>
      <div class="brand-name">TabTidy</div>
      <div class="brand-sub">Group &amp; organise your tabs</div>
    </div>
    <button class="header-settings" id="btn-settings">⚙</button>
  </header>

  <div class="btn-wrap">
    <button class="btn-group" id="btn-group">Group all tabs</button>
    <button class="btn-sm-action danger" id="btn-ungroup">Ungroup all</button>
  </div>

  <div class="toolbar" id="toolbar">
    <div class="sort-pills">
      <button class="sort-pill active" data-sort="default">Default</button>
      <button class="sort-pill" data-sort="alpha">A–Z</button>
      <button class="sort-pill" data-sort="count">By count</button>
    </div>
    <button class="btn-save-session" id="btn-save-session">Save session</button>
  </div>

  <div class="summary" id="summary" style="display:none"></div>
  <div class="status" id="status"></div>

  <div class="empty" id="empty">
    <div class="empty-icon">
      <svg width="18" height="18" viewBox="0 0 52 52" fill="none">
        <rect x="8"  y="8"  width="16" height="16" rx="4" fill="#DDDDDD"/>
        <rect x="28" y="8"  width="16" height="16" rx="4" fill="#DDDDDD"/>
        <rect x="8"  y="28" width="16" height="16" rx="4" fill="#DDDDDD"/>
        <rect x="28" y="28" width="16" height="16" rx="4" fill="#DDDDDD"/>
      </svg>
    </div>
    Click "Group all tabs" to organise<br>your open tabs by domain.
  </div>

  <div class="groups" id="groups"></div>

  <!-- Sessions section -->
  <div class="sessions-section" id="sessions-section" style="display:none">
    <div class="sessions-header" id="sessions-toggle">
      <span>Saved sessions</span>
      <span id="sessions-chevron">▶</span>
    </div>
    <div class="sessions-list" id="sessions-list"></div>
  </div>

  <!-- Settings overlay -->
  <div id="view-settings">
    <div class="settings-header">
      <button class="btn-back" id="btn-settings-back">← Back</button>
      <div class="settings-title">Settings</div>
    </div>
    <div class="settings-body">
      <div class="setting-row">
        <div>
          <div class="setting-label">Auto-group on startup</div>
          <div class="setting-hint">Automatically group tabs when the browser starts.</div>
        </div>
        <button class="toggle" id="toggle-autogroup"></button>
      </div>
    </div>
  </div>

  <!-- Save session modal -->
  <div id="modal-save-session">
    <div class="modal-box">
      <div class="modal-title">Save session</div>
      <input class="modal-input" id="session-name-input" type="text" placeholder="e.g. Work research"/>
      <div class="modal-actions">
        <button class="btn-modal-cancel" id="btn-modal-cancel">Cancel</button>
        <button class="btn-modal-save" id="btn-modal-save">Save</button>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
